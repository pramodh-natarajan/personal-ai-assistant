agent:
  name: "Bodhi"
  default_profile: "personal"
  generate_titles: false

# Hermes model block — max_tokens capped to fit Groq 8000 TPM limit
model:
  provider: "custom"
  default: "openai/gpt-oss-120b"
  base_url: "https://api.groq.com/openai/v1"
  api_key: "${GROQ_API_KEY}"
  max_tokens: 1024

custom_providers:
  - name: groq
    base_url: "https://api.groq.com/openai/v1"
    api_key: "${GROQ_API_KEY}"
    model: "openai/gpt-oss-120b"

auxiliary:
  compression:
    provider: "custom"
    model: "openai/gpt-oss-20b"
    base_url: "https://api.groq.com/openai/v1"
    api_key: "${GROQ_API_KEY}"
    max_tokens: 512
  title_generation:
    provider: "custom"
    model: "openai/gpt-oss-20b"
    base_url: "https://api.groq.com/openai/v1"
    api_key: "${GROQ_API_KEY}"
    max_tokens: 512
  curator:
    provider: "custom"
    model: "openai/gpt-oss-20b"
    base_url: "https://api.groq.com/openai/v1"
    api_key: "${GROQ_API_KEY}"
    max_tokens: 512

fallback_providers:
  - provider: "custom"
    model: "openai/gpt-oss-20b"
    base_url: "https://api.groq.com/openai/v1"
    api_key: "${GROQ_API_KEY}"
    max_tokens: 512

memory:
  memory_enabled: true
  user_profile_enabled: true
  memory_char_limit: 1500
  user_char_limit: 1000
  write_approval: false

curator:
  enabled: true
  interval_hours: 168
  consolidate: true

gateway:
  signal:
    enabled: true
    http_url: "${SIGNAL_HTTP_URL:-http://127.0.0.1:8080}"
    account: "${SIGNAL_ACCOUNT}"
    allowed_users:
      - "${SIGNAL_ALLOWED_USERS}"
  cli:
    enabled: true
    unified_session: true