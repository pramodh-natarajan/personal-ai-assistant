agent:
  name: "Bodhi"
  default_profile: "personal"
  generate_titles: false

# Active Groq model configuration using supported endpoints
model:
  provider: "custom"
  default: "llama3-70b-8192"
  base_url: "https://api.groq.com/openai/v1"
  api_key: "${GROQ_API_KEY}"
  max_tokens: 1024

custom_providers:
  - name: groq
    base_url: "https://api.groq.com/openai/v1"
    api_key: "${GROQ_API_KEY}"
    model: "llama3-70b-8192"

auxiliary:
  compression:
    provider: "custom"
    model: "llama3-8b-8192"
    base_url: "https://api.groq.com/openai/v1"
    api_key: "${GROQ_API_KEY}"
  title_generation:
    provider: "custom"
    model: "llama3-8b-8192"
    base_url: "https://api.groq.com/openai/v1"
    api_key: "${GROQ_API_KEY}"
  curator:
    provider: "custom"
    model: "llama3-8b-8192"
    base_url: "https://api.groq.com/openai/v1"
    api_key: "${GROQ_API_KEY}"

fallback_providers:
  - provider: "custom"
    model: "llama3-8b-8192"
    base_url: "https://api.groq.com/openai/v1"
    api_key: "${GROQ_API_KEY}"

# Disables unused tool schemas that inflate system prompt token count
tools:
  disabled:
    - "browser"
    - "browser_cdp"
    - "browser_dialog"
    - "browser_vision"
    - "close_terminal"
    - "computer_use"
    - "image_generation"
    - "kanban"
    - "kanban_orchestrator"
    - "read_terminal"
    - "vision"

memory:
  memory_enabled: true
  user_profile_enabled: true
  memory_char_limit: 2000
  user_char_limit: 1500
  write_approval: false

curator:
  enabled: true
  interval_hours: 168
  consolidate: true

gateway:
  signal:
    enabled: true
    http_url: "${SIGNAL_HTTP_URL:-http://127.0.0.1:8080}"
    account: "${SIGNAL_ACCOUNT}"
    allowed_users:
      - "${SIGNAL_ALLOWED_USERS}"
  cli:
    enabled: true
    unified_session: true
