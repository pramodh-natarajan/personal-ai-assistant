agent:
  name: "Bodhi"
  default_profile: "personal"
  generate_titles: false

models:
  primary:
    provider: "groq"
    model: "llama-3.3-70b-versatile"
    api_key: "${GROQ_API_KEY}"
    max_tokens: 2048
  utility:
    provider: "groq"
    model: "llama-3.1-8b-instant"
    api_key: "${GROQ_API_KEY}"
    max_tokens: 1024
  auxiliary:
    provider: "groq"
    model: "llama-3.1-8b-instant"
    api_key: "${GROQ_API_KEY}"
    max_tokens: 1024
  fallback:
    provider: "groq"
    model: "llama-3.1-8b-instant"
    api_key: "${GROQ_API_KEY}"
    max_tokens: 1024

memory:
  memory_enabled: true
  user_profile_enabled: true
  memory_char_limit: 3000
  user_char_limit: 2000
  write_approval: false

curator:
  enabled: true
  interval_hours: 168
  consolidate: true

gateway:
  signal:
    enabled: true
    http_url: "${SIGNAL_HTTP_URL:-http://127.0.0.1:8080}"
    account: "${SIGNAL_ACCOUNT}"
    allowed_users:
      - "${SIGNAL_ALLOWED_USERS}"
  cli:
    enabled: true
    unified_session: true