agent:
  name: "Bodhi"
  default_profile: "personal"
  generate_titles: false

# Hermes primary model block
model:
  provider: "custom"
  default: "gemini-1.5-flash"
  base_url: "https://generativelanguage.googleapis.com/v1beta/openai/"
  api_key: "${GEMINI_API_KEY}"
  max_tokens: 2048

# Provider name must match provider: "custom" to preserve trailing slash in base_url
custom_providers:
  - name: custom
    base_url: "https://generativelanguage.googleapis.com/v1beta/openai/"
    api_key: "${GEMINI_API_KEY}"
    model: "gemini-1.5-flash"

auxiliary:
  compression:
    provider: "custom"
    model: "gemini-1.5-flash"
    base_url: "https://generativelanguage.googleapis.com/v1beta/openai/"
    api_key: "${GEMINI_API_KEY}"
  title_generation:
    provider: "custom"
    model: "gemini-1.5-flash"
    base_url: "https://generativelanguage.googleapis.com/v1beta/openai/"
    api_key: "${GEMINI_API_KEY}"
  curator:
    provider: "custom"
    model: "gemini-1.5-flash"
    base_url: "https://generativelanguage.googleapis.com/v1beta/openai/"
    api_key: "${GEMINI_API_KEY}"

fallback_providers:
  - provider: "custom"
    model: "gemini-1.5-flash"
    base_url: "https://generativelanguage.googleapis.com/v1beta/openai/"
    api_key: "${GEMINI_API_KEY}"

# Disables unused tool schemas
tools:
  disabled:
    - "browser"
    - "browser_cdp"
    - "browser_dialog"
    - "browser_vision"
    - "close_terminal"
    - "computer_use"
    - "image_generation"
    - "kanban"
    - "kanban_orchestrator"
    - "read_terminal"
    - "vision"

memory:
  memory_enabled: true
  user_profile_enabled: true
  memory_char_limit: 3000
  user_char_limit: 2000
  write_approval: false

curator:
  enabled: true
  interval_hours: 168
  consolidate: true

gateway:
  signal:
    enabled: true
    http_url: "${SIGNAL_HTTP_URL:-http://127.0.0.1:8080}"
    account: "${SIGNAL_ACCOUNT}"
    allowed_users:
      - "${SIGNAL_ALLOWED_USERS}"
  cli:
    enabled: true
    unified_session: true