agent:
  name: "Bodhi"
  default_profile: "personal"
  generate_titles: false

# Hermes requires this singular `model` block (not `models:`).
model:
  provider: "custom"
  default: "openai/gpt-oss-120b"
  base_url: "https://api.groq.com/openai/v1"
  api_key: "${GROQ_API_KEY}"
  max_tokens: 2048

# Must be a YAML list (each item prefixed with '-'), not a mapping.
custom_providers:
  - name: groq
    base_url: "https://api.groq.com/openai/v1"
    api_key: "${GROQ_API_KEY}"
    model: "openai/gpt-oss-120b"

auxiliary:
  compression:
    provider: "custom"
    model: "openai/gpt-oss-20b"
    base_url: "https://api.groq.com/openai/v1"
    api_key: "${GROQ_API_KEY}"
  title_generation:
    provider: "custom"
    model: "openai/gpt-oss-20b"
    base_url: "https://api.groq.com/openai/v1"
    api_key: "${GROQ_API_KEY}"
  curator:
    provider: "custom"
    model: "openai/gpt-oss-20b"
    base_url: "https://api.groq.com/openai/v1"
    api_key: "${GROQ_API_KEY}"

fallback_providers:
  - provider: "custom"
    model: "openai/gpt-oss-20b"
    base_url: "https://api.groq.com/openai/v1"
    api_key: "${GROQ_API_KEY}"

memory:
  memory_enabled: true
  user_profile_enabled: true
  memory_char_limit: 3000
  user_char_limit: 2000
  write_approval: false

curator:
  enabled: true
  interval_hours: 168
  consolidate: true

gateway:
  signal:
    enabled: true
    http_url: "${SIGNAL_HTTP_URL:-http://127.0.0.1:8080}"
    account: "${SIGNAL_ACCOUNT}"
    allowed_users:
      - "${SIGNAL_ALLOWED_USERS}"
  cli:
    enabled: true
    unified_session: true
