services:
  - type: web
    name: personal-ai-assistant
    env: docker
    plan: free
    region: oregon
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: 10000
      - key: OPENROUTER_API_KEY
        sync: false
      - key: SIGNAL_ACCOUNT
        sync: false
      - key: SIGNAL_ALLOWED_USERS
        sync: false
      - key: SIGNAL_HTTP_URL
        value: "http://127.0.0.1:8080"
      - key: HERMES_MODEL
        value: "google/gemini-2.0-flash-exp:free"
      - key: OPENROUTER_MODEL
        value: "google/gemini-2.0-flash-exp:free"
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_USER
        sync: false
      - key: BACKUP_REPO
        value: "bodhi-state"