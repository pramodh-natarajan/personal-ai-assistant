services:
  - type: web
    name: personal-ai-assistant
    env: docker
    plan: free
    region: oregon
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: 10000
      - key: OPENROUTER_API_KEY
        sync: false
      - key: ALLOWED_WHATSAPP_NUMBER
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_USER
        sync: false
      - key: BACKUP_REPO
        value: "bodhi-state"